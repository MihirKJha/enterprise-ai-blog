site_name: Enterprise AI Engineering Blog

site_description: >
  Technical articles and deep dives on AI Engineering, Generative AI,
  RAG, AI Agents, Cloud Architecture, Backend Engineering, and System Design.

site_author: Mihir Jha

site_url: https://enterpriseai.blog.mihirkjha.com/

repo_url: https://github.com/MihirKJha/enterprise-ai-blog
repo_name: MihirKJha/enterprise-ai-blog

search:
  boost: 1.2

hooks:
  - hooks/normalize_headings.py

edit_uri: edit/main/docs/

copyright: Copyright © 2026 Mihir Jha

theme:
  name: material
  language: en

  logo: assets/logos/favicon.png
  favicon: assets/logos/favicon.png

  custom_dir: overrides

  features:
    # Navigation
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer

    # Search
    - search.highlight
    - search.share
    - search.suggest

    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

    # Table of Contents
    - toc.follow

  palette:

    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:

  # Core Markdown
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - toc:
      permalink: true

  # PyMdown Extensions
  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji

  - pymdownx.keys

  - pymdownx.mark

  - pymdownx.caret

  - pymdownx.tilde

plugins:
  - search
  - social
  - mermaid2

  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

nav:
  - Home: index.md
  - About: about.md

  - Architecture Insights:
      - Overview: architecture-insights/index.md
      - Gen AI & RAG:
          - Where RAG Fits in Architecture: architecture-insights/genai-and-rag/1.1-where-rag-fits-in-enterprise-ai-architecture.md
          - From LLM Apps to Enterprise RAG : architecture-insights/genai-and-rag/1.2-from-llm-applications-to-enterprise-rag-systems.md
          - Anatomy of an Enterprise RAG Request: architecture-insights/genai-and-rag/1.3-anatomy-of-an-enterprise-rag-request.md
          - What Belongs Inside Retrieval: architecture-insights/genai-and-rag/1.4-designing-rag-system-boundaries.md
          - Designing Enterprise Knowledge Architecture For AI: architecture-insights/genai-and-rag/1.5-designing-enterprise-knowledge-architecture-for-ai.md
          - Designing Reliable Enterprise AI: architecture-insights/genai-and-rag/2.1-designing-reliable-enterprise-ai-failure-fallback-control.md
          - Architecting The Retrieval Layer: architecture-insights/genai-and-rag/2.2-architecting-the-retrieval-layer-for-enterprise-rag.md
          - Engineering Query Transformation Pipelines: architecture-insights/genai-and-rag/2.3-engineering-query-transformation-pipelines-for-enterprise-retrieval.md
          - Structuring Metadata & Document-Aware Retrieval: architecture-insights/genai-and-rag/2.4-structuring-metadata-and-document-aware-retrieval.md
          - Architecting Retriever Selection: architecture-insights/genai-and-rag/2.5-architecting-retriever-selection-an-enterprise-decision-framework.md
          #- Engineering the Context Control Layer for Enterprise Retrieval: architecture-insights/genai-and-rag/3.1-engineering-the-context-control-layer-for-enterprise-retrieval.md
          #- Architecting Multi Signal Retrieval: architecture-insights/genai-and-rag/3.2-architecting-multi-signal-retrieval-for-enterprise-ai.md
          #- Architecting Multi Representation Knowledge Retrieval: architecture-insights/genai-and-rag/3.3-architecting-multi-representation-knowledge-retrieval.md


  - Articles:

      - AI for Backend Engineers:
          - Overview: articles/ai-for-backend-engineers/index.md
          - Blog 01 — Intelligent Systems: articles/ai-for-backend-engineers/blog-01-building-intelligent-systems.md
          - Blog 02 — Production AI Data: articles/ai-for-backend-engineers/blog-02-preparing-data-for-production-ai.md
          - Blog 03 — ML Algorithms Selection: articles/ai-for-backend-engineers/blog-03-choosing-the-right-machine-learning-algorithms.md
          - Blog 04 — Production AI Challenges: articles/ai-for-backend-engineers/blog-04-why-ai-projects-fail-in-production.md
          - Blog 05 — Deep Learning Foundations: articles/ai-for-backend-engineers/blog-05-deep-learning-the-foundation-of-modern-ai.md
          - Blog 06 — LLM Internals: articles/ai-for-backend-engineers/blog-06-large-language-models-inside-the-engine-of-generative-ai.md
          - Blog 07 — LLM Application Engineering: articles/ai-for-backend-engineers/blog-07-large-language-models-from-foundation-models-to-ai-applications.md
          - Blog 08 — Enterprise Model Adaptation: articles/ai-for-backend-engineers/blog-08-large-language-models-adapting-foundation-models-for-enterprise-ai.md

      - Inside Modern AI Systems:
          - Overview: articles/inside-modern-ai-systems/index.md

      - Enterprise AI Engineering:
          - Overview: articles/enterprise-ai-engineering/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MihirKJha

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mihirkrjha/

extra_css:
  - stylesheets/typography.css
  - stylesheets/layout.css
  - stylesheets/code.css
  - stylesheets/tables.css
  - stylesheets/admonitions.css
  - stylesheets/cards.css
  - stylesheets/homepage.css
  - stylesheets/custom.css
  - stylesheets/extra.css
  - stylesheets/navigation.css
  - stylesheets/reader.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
  - javascripts/navigation.js